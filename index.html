<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP4 - Pruebas Estadísticas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0a0e17',
                        cardBg: 'rgba(17, 24, 39, 0.7)',
                        primary: '#8b5cf6',
                        secondary: '#06b6d4'
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@500;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-darkBg text-gray-200 font-sans min-h-screen flex flex-col relative overflow-x-hidden">
    <div class="fixed top-[-20%] left-[-10%] w-[50%] h-[50%] bg-primary/20 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="fixed bottom-[-20%] right-[-10%] w-[50%] h-[50%] bg-secondary/20 rounded-full blur-[120px] pointer-events-none"></div>

    <main class="container mx-auto px-4 py-10 relative z-10 flex-grow">
        
        <header class="text-center mb-10">
            <h1 class="text-4xl md:text-5xl font-[Outfit] font-bold text-transparent bg-clip-text bg-gradient-to-r from-primary to-secondary mb-4">
                Pruebas Estadísticas
            </h1>
            <p class="text-lg text-gray-400 max-w-2xl mx-auto">
                Laboratorio Interactivo: Cada asignación consta de DOS pruebas estadísticas.
            </p>
        </header>

        <div class="flex flex-wrap justify-center gap-2 mb-8" id="exercise-tabs"></div>

        <!-- Boton Guardar Principal -->
        <div class="text-center mb-8">
            <button id="btn-validate-all" class="bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-400 hover:to-emerald-500 text-white font-bold py-3 px-8 rounded-full shadow-lg hover:shadow-emerald-500/50 transition-all transform hover:scale-105 text-lg">
                ✅ Validar Ambos Ejercicios y Descargar Comprobante
            </button>
        </div>

        <!-- Ejercicio A -->
        <div class="mb-12">
            <h2 class="text-3xl font-[Outfit] font-bold text-primary mb-6 border-b border-gray-700 pb-2">Ejercicio A</h2>
            <div class="glass-panel p-6 rounded-2xl shadow-xl max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div class="space-y-6">
                    <div>
                        <h3 class="text-xl font-[Outfit] font-semibold mb-3 border-b border-gray-700 pb-2">Parámetros</h3>
                        <div class="bg-gray-800/30 p-4 rounded-xl border border-gray-700/30">
                            <p id="enunciado-desc-A" class="mb-4 text-sm text-gray-300"></p>
                            <h4 class="text-sm font-semibold mb-2">Secuencia de Datos:</h4>
                            <div class="bg-gray-900/50 p-3 rounded-lg max-h-40 overflow-y-auto font-mono text-xs text-secondary/80" id="datos-raw-A"></div>
                        </div>
                    </div>
                </div>
                <div class="space-y-6">
                    <div class="bg-gray-800/50 p-5 rounded-xl border border-gray-700/50">
                        <h3 class="text-xl font-[Outfit] font-semibold mb-4 text-white">Workbench de Cómputo (A)</h3>
                        <form id="calc-form-A" class="space-y-3"></form>
                    </div>
                    <div class="bg-gray-800/30 p-4 rounded-xl border border-gray-700/30">
                        <h4 class="text-sm font-semibold mb-2 text-center text-gray-400">Representación Gráfica</h4>
                        <div class="relative h-64 w-full">
                            <canvas id="graficoCanvas-A"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Ejercicio B -->
        <div class="mb-12">
            <h2 class="text-3xl font-[Outfit] font-bold text-secondary mb-6 border-b border-gray-700 pb-2">Ejercicio B</h2>
            <div class="glass-panel p-6 rounded-2xl shadow-xl max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div class="space-y-6">
                    <div>
                        <h3 class="text-xl font-[Outfit] font-semibold mb-3 border-b border-gray-700 pb-2">Parámetros</h3>
                        <div class="bg-gray-800/30 p-4 rounded-xl border border-gray-700/30">
                            <p id="enunciado-desc-B" class="mb-4 text-sm text-gray-300"></p>
                            <h4 class="text-sm font-semibold mb-2">Secuencia de Datos:</h4>
                            <div class="bg-gray-900/50 p-3 rounded-lg max-h-40 overflow-y-auto font-mono text-xs text-secondary/80" id="datos-raw-B"></div>
                        </div>
                    </div>
                </div>
                <div class="space-y-6">
                    <div class="bg-gray-800/50 p-5 rounded-xl border border-gray-700/50">
                        <h3 class="text-xl font-[Outfit] font-semibold mb-4 text-white">Workbench de Cómputo (B)</h3>
                        <form id="calc-form-B" class="space-y-3"></form>
                    </div>
                    <div class="bg-gray-800/30 p-4 rounded-xl border border-gray-700/30">
                        <h4 class="text-sm font-semibold mb-2 text-center text-gray-400">Representación Gráfica</h4>
                        <div class="relative h-64 w-full">
                            <canvas id="graficoCanvas-B"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </main>
    <script src="js/ejercicios_data.js?v=2"></script>
    <script src="js/visualizadores.js"></script>
    <script src="js/app.js?v=2"></script>
</body>
</html>
